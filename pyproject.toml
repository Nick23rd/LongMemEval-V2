[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longmemeval-v2-artifact"
version = "0.1.0"
description = "Public evaluation artifact for LongMemEval-V2."
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub",
  "numpy",
  "openai",
  "openai-agents",
  "pillow",
  "tqdm",
  "transformers",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]
torch = [
  "torch",
  "torchvision",
]

[tool.setuptools.packages.find]
include = ["data", "evaluation", "memory_modules", "memory_modules.*"]

[tool.setuptools.package-data]
memory_modules = [
  "assets/agentrunbook_c/INSTRUCTION.md",
  "assets/agentrunbook_c/scripts/*.py",
  "assets/agentrunbook_online_learning/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
